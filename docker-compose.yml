services:
  postgres:
    image: postgres:16-alpine
    container_name: dme-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dme
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dme']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
