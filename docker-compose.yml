services:
  postgres:
    # pgvector-enabled PG16 for the policy RAG index (step 6). The alpine image
    # cannot install the vector extension; same major version, so the volume is compatible.
    image: pgvector/pgvector:pg16
    container_name: dme-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dme
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dme']
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    # Event broker: order.created fan-out to the analysis worker.
    # Management UI: http://localhost:15672 (dme / dme)
    image: rabbitmq:4-management-alpine
    container_name: dme-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dme
      RABBITMQ_DEFAULT_PASS: dme
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    # Cache for order reads; AOF keeps the demo cache warm across restarts.
    image: redis:7-alpine
    container_name: dme-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Official MinIO images were removed from Docker Hub and Quay in 2026.
    # This pinned community mirror is the last release (CVE-2025-62506 fixed).
    # S3 API: http://localhost:9000 — console: http://localhost:9001
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: dme-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: dme
      MINIO_ROOT_PASSWORD: dme-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  miniodata:
